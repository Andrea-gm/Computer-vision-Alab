vial_detector_node:
  ros__parameters:
    # Live camera topic (sensor_msgs/Image, bgr8 or rgb8).
    image_topic: "/camera/color/image_raw"
    # Offline folder of images (jpg/png). Empty = subscribe mode only.
    dataset_path: "E:/Desktop/Jessica/robotics/vial_dataset/raw"
    # true = iterate dataset_path once (or loop); false = subscribe to image_topic.
    run_offline: true

    # --- HSV white-cap ranges (calibrated on split_70_10_20 train samples) ---
    # Opaque white screw cap: very low saturation, high value. Hue is unused
    # (cap is near-achromatic; ~97% of cap pixels have S<40).
    hsv_h_min: 0
    hsv_h_max: 179
    hsv_s_min: 0
    hsv_s_max: 40
    hsv_v_min: 195
    hsv_v_max: 255

    # --- LAB white-cap ranges (OpenCV L,a,b with a/b centered at 128) ---
    lab_l_min: 190
    lab_l_max: 255
    lab_a_center: 128
    lab_a_tol: 12
    lab_b_center: 128
    lab_b_tol: 12

    # Morphology (ellipse kernels, odd sizes).
    morph_open_ksize: 5
    morph_close_ksize: 5

    # Edge assist for clear cup under the white cap (still classical color-seg family).
    use_edge_assist: true
    canny_low: 50
    canny_high: 120
    body_expand_cap_h_mult: 2.6
    body_expand_cap_w_mult: 1.35

    # Contour / connected-component filters (shape priors).
    min_area_frac: 0.0006
    max_area_frac: 0.08
    min_box_aspect: 0.75
    max_box_aspect: 2.6
    max_box_area_frac: 0.28
    min_cap_fill: 0.25
    min_score: 0.42
    max_dets: 3
    nms_iou: 0.35

    visualize: true
    annotated_topic: "/vial/annotated"
    # Preferred: vision_msgs/Detection2DArray. Fallback: std_msgs/String JSON.
    detections_topic: "/vial/detections"
    detections_json_topic: "/vial/detections_json"
    frame_id: "camera_color_optical_frame"
    offline_rate_hz: 5.0
    offline_loop: false
    log_every_n: 10
