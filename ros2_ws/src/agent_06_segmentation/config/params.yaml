vial_detector_node:
  ros__parameters:
    # Live camera topic (sensor_msgs/Image, bgr8 or rgb8).
    image_topic: "/camera/color/image_raw"
    # Offline folder of images (jpg/png). Empty = subscribe mode only.
    dataset_path: "E:/Desktop/Jessica/robotics/vial_dataset/raw"
    # true = iterate dataset_path; false = subscribe to image_topic.
    run_offline: true
    # Prefer trained seg weights when present. Empty = auto-resolve:
    #   runs/vial-seg → yolov8n-seg.pt → vial-live det (+ mask-from-bbox).
    model_path: ""
    camera_root: "E:/Desktop/Jessica/robotics"
    confidence_threshold: 0.25
    iou_threshold: 0.45
    imgsz: 640
    # When the loaded model has no mask head (or empty masks): ellipse | rect | none
    mask_fallback: "ellipse"
    visualize: true
    publish_mask_overlay: true
    annotated_topic: "/vial/annotated"
    mask_overlay_topic: "/vial/mask_overlay"
    detections_topic: "/vial/detections"
    detections_json_topic: "/vial/detections_json"
    frame_id: "camera_color_optical_frame"
    offline_rate_hz: 5.0
    offline_loop: false
    log_every_n: 10
