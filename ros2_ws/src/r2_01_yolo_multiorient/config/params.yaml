vial_detector_node:
  ros__parameters:
    image_topic: "/camera/color/image_raw"
    dataset_path: "E:/Desktop/Jessica/robotics/vial_dataset/raw"
    run_offline: true
    # Multi-orient fine-tune (preferred). Falls back to Camera/runs if missing.
    model_path: "E:/Desktop/Jessica/ros2_ws/src/r2_01_yolo_multiorient/models/best.pt"
    camera_root: "E:/Desktop/Jessica/robotics"
    confidence_threshold: 0.25
    iou_threshold: 0.45
    imgsz: 640
    # Extra 90° CW/CCW inference pass — critical for upright-biased weights.
    tta_rotate: true
    visualize: true
    annotated_topic: "/vial/annotated"
    detections_topic: "/vial/detections"
    detections_json_topic: "/vial/detections_json"
    frame_id: "camera_color_optical_frame"
    offline_rate_hz: 5.0
    offline_loop: false
    log_every_n: 10
