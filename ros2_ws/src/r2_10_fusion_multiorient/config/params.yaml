vial_detector_node:
  ros__parameters:
    image_topic: "/orbbec/cam0/color/image_raw"
    depth_topic: "/orbbec/cam0/depth/image_raw"
    image_topic_2: "/orbbec/cam1/color/image_raw"
    depth_topic_2: "/orbbec/cam1/depth/image_raw"
    dataset_path: "E:/Desktop/Jessica/robotics/vial_dataset/raw"
    run_offline: true
    # Production weights — do NOT repoint to r2_01 (ERROR_AUDIT.md A/B).
    model_path: "E:/Desktop/Jessica/robotics/runs/vial-live/weights/best.pt"
    # Preserve audited YOLO behavior for offline replay/evaluation.
    use_yolo: true
    # Windows RoboStack can natively abort a ROS launch child (exit code 3)
    # while loading/running Torch. Live ROS therefore defaults classical-only.
    use_yolo_live: false
    camera_root: "E:/Desktop/Jessica/robotics"
    # Base YOLO threshold; fusion also applies empty_scene_yolo_floor (0.35).
    confidence_threshold: 0.25
    iou_threshold: 0.45
    imgsz: 640
    use_yolo_tta: true
    # Classical upright + depth-gated Method-I sideways.
    use_classical: true
    use_classical_sideways: true
    # ERROR_AUDIT: RGB-only classical sideways FPs on upright stills — off by default.
    enable_rgb_classical_sideways: false
    use_cap_refine: true
    # Post-Method-I extra YOLO gate (audit: kills 22 hard-sideways FPs at 0.60).
    extra_yolo_conf_after_method_i: 0.60
    # Native / all-YOLO floor for empty-scene clutter (audit: vial_0035 @ 0.288).
    empty_scene_yolo_floor: 0.35
    # Pose-aware Method-I-empty keep threshold for upright/top-down YOLO.
    empty_method_i_keep_conf: 0.50
    visualize: true
    annotated_topic: "/vial/annotated"
    detections_topic: "/vial/detections"
    detections_json_topic: "/vial/detections_json"
    frame_id: "camera_color_optical_frame"
    offline_rate_hz: 5.0
    offline_loop: false
    log_every_n: 10
