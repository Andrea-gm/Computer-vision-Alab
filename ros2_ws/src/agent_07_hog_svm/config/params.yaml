vial_detector_node:
  ros__parameters:
    image_topic: /camera/color/image_raw
    dataset_path: ""
    # Leave unset or set absolute path; node falls back to package models/hog_svm_vial.json
    model_path: "models/hog_svm_vial.json"
    confidence_threshold: 0.5
    visualize: true
    publish_rate_hz: 5.0
    scale_factor: 1.25
    step_size: 8
    max_image_side: 480
    nms_iou: 0.3
    frame_id: camera
