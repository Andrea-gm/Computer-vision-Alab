vial_detector_node:
  ros__parameters:
    # Live camera topic (sensor_msgs/Image, bgr8 or rgb8).
    image_topic: "/camera/color/image_raw"
    # Offline folder of images (jpg/png). Empty = subscribe mode only.
    dataset_path: "E:/Desktop/Jessica/robotics/vial_dataset/raw"
    # true = iterate dataset_path once (or loop); false = subscribe to image_topic.
    run_offline: true
    # Directory of extracted vial templates (png + meta.json). Empty = package default.
    templates_dir: ""
    # Camera root used for dataset / template auto-discovery.
    camera_root: "E:/Desktop/Jessica/robotics"
    # Primary: multi-scale NCC template match threshold (TM_CCOEFF_NORMED blend).
    template_score_threshold: 0.52
    # Secondary: ORB/AKAZE feature match (homography from inliers).
    enable_feature_match: true
    feature_backend: "AKAZE"   # AKAZE | ORB | SIFT
    min_feature_matches: 8
    min_homography_inliers: 6
    # White-cap consistency gate (reduces empty-scene FP).
    require_white_cap: true
    # NMS / aspect filters.
    nms_iou: 0.40
    # Dataset / live cell is single-vial; keep top-1 after NMS.
    max_detections: 1
    aspect_min: 0.75
    aspect_max: 2.20
    # Multi-scale search.
    scale_min: 0.50
    scale_max: 2.20
    scale_steps: 8
    # Working width for matching (0 = native). Speeds up large Orbbec frames.
    match_max_width: 480
    visualize: true
    annotated_topic: "/vial/annotated"
    detections_topic: "/vial/detections"
    detections_json_topic: "/vial/detections_json"
    frame_id: "camera_color_optical_frame"
    offline_rate_hz: 5.0
    offline_loop: false
    log_every_n: 10
