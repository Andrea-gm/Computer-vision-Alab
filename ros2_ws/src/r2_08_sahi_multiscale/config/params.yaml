vial_detector_node:
  ros__parameters:
    image_topic: "/camera/color/image_raw"
    # Synth full-frames exercise small upright + sideways vials.
    dataset_path: "E:/Desktop/Jessica/robotics/sideways_race/synth"
    run_offline: true
    model_path: "E:/Desktop/Jessica/robotics/runs/bon-winner/weights/best.pt"
    camera_root: "E:/Desktop/Jessica/robotics"
    confidence_threshold: 0.25
    iou_threshold: 0.45
    imgsz: 640
    # baseline | sahi
    mode: "sahi"
    slice_width: 320
    slice_height: 320
    overlap_ratio: 0.25
    # Comma-separated image scales applied before tiling / full-frame.
    image_scales: "1.0,1.5"
    rotation_tta: true
    visualize: true
    annotated_topic: "/vial/annotated"
    detections_topic: "/vial/detections"
    detections_json_topic: "/vial/detections_json"
    frame_id: "camera_color_optical_frame"
    offline_rate_hz: 2.0
    offline_loop: false
    log_every_n: 5
