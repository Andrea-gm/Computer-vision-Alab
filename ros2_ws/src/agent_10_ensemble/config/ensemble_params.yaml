vial_detector_node:
  ros__parameters:
    image_topic: /camera/color/image_raw
    detections_topic: /vial/detections
    annotated_topic: /vial/annotated
    frame_id: camera_color_optical_frame
    use_cap: true
    use_edge: true
    use_yolo: true
    # Leave empty to auto-discover Camera/runs/*/weights/best.pt
    yolo_weights: ""
    yolo_conf: 0.10
    # Leave empty to use share/.../models/verifier.pkl
    verifier_path: ""
    verifier_thresh: 0.42
    nms_iou: 0.45
    use_soft_nms: false
    max_det: 5
    # Path to E:/Desktop/Jessica/robotics for weight discovery
    camera_root: "E:/Desktop/Jessica/robotics"
