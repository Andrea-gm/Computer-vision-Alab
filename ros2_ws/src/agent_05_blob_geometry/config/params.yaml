vial_detector_node:
  ros__parameters:
    image_topic: "/camera/color/image_raw"
    dataset_path: "E:/Desktop/Jessica/robotics/vial_dataset/split_70_10_20/images/test"
    run_offline: true
    confidence_threshold: 0.70
    max_detections: 2
    visualize: true
    annotated_topic: "/vial/annotated"
    detections_topic: "/vial/detections"
    detections_json_topic: "/vial/detections_json"
    frame_id: "camera_color_optical_frame"
    offline_rate_hz: 5.0
    offline_loop: false
    log_every_n: 10

    # Preprocess
    clahe_clip: 2.0
    gaussian_ksize: 5
    white_s_max: 70
    white_v_min: 170

    # SimpleBlobDetector (bright blobs = white caps / round tops)
    blob_min_area: 120.0
    blob_max_area: 25000.0
    blob_min_circularity: 0.55
    blob_min_inertia: 0.35
    blob_min_convexity: 0.75
    blob_min_dist: 20.0
    blob_min_size: 14.0
    blob_max_size: 220.0

    # MSER + contour geometric priors
    mser_delta: 4
    mser_min_area: 150
    mser_max_area: 20000
    geom_min_circularity: 0.50
    geom_min_convexity: 0.80
    geom_min_inertia: 0.30
    geom_min_aspect: 0.50
    geom_max_aspect: 2.00

    # Cap → full-vial box expansion (dataset-calibrated side-view prior)
    expand_width_scale: 2.4
    expand_height_scale: 3.6
    nms_iou: 0.35
