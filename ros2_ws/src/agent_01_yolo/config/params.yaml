vial_detector_node:
  ros__parameters:
    # Live camera topic (sensor_msgs/Image, bgr8 or rgb8).
    image_topic: "/camera/color/image_raw"
    # Offline folder of images (jpg/png). Empty = subscribe mode only.
    dataset_path: "E:/Desktop/Jessica/robotics/vial_dataset/raw"
    # true = iterate dataset_path once (or loop); false = subscribe to image_topic.
    run_offline: true
    # Preferred fine-tuned weights. Empty = auto-resolve vial-live → r1 → bon → yolov8s.
    model_path: "E:/Desktop/Jessica/robotics/runs/vial-live/weights/best.pt"
    # Camera root used for weight / dataset auto-discovery.
    camera_root: "E:/Desktop/Jessica/robotics"
    confidence_threshold: 0.25
    iou_threshold: 0.45
    imgsz: 640
    # If YOLO model cannot load, use white-cap classical fallback (demo only).
    allow_classical_fallback: true
    visualize: true
    # Publish annotated image on this topic.
    annotated_topic: "/vial/annotated"
    # Preferred: vision_msgs/Detection2DArray. Fallback: std_msgs/String JSON.
    detections_topic: "/vial/detections"
    detections_json_topic: "/vial/detections_json"
    frame_id: "camera_color_optical_frame"
    # Offline playback rate (Hz). 0 = as-fast-as-possible.
    offline_rate_hz: 5.0
    offline_loop: false
    log_every_n: 10
