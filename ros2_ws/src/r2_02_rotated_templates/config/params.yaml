vial_detector_node:
  ros__parameters:
    image_topic: "/camera/color/image_raw"
    dataset_path: "E:/Desktop/Jessica/robotics/vial_dataset/raw"
    run_offline: true
    templates_dir: ""
    camera_root: "E:/Desktop/Jessica/robotics"
    # Multi-scale × multi-angle NCC threshold (gray+edge blend).
    template_score_threshold: 0.52
    # Orientation-aware white-cap gate (top/bottom/left/right strips).
    require_white_cap: true
    nms_iou: 0.40
    max_detections: 1
    # Wide enough for sideways (~0.45) and upright (~1.5) boxes.
    aspect_min: 0.35
    aspect_max: 3.00
    scale_min: 0.55
    scale_max: 2.00
    scale_steps: 6
    match_max_width: 400
    # Comma-separated in-plane rotation angles (degrees).
    angles_deg: "0,45,90,135,180,225,270,315"
    visualize: true
    annotated_topic: "/vial/annotated"
    detections_topic: "/vial/detections"
    detections_json_topic: "/vial/detections_json"
    frame_id: "camera_color_optical_frame"
    offline_rate_hz: 5.0
    offline_loop: false
    log_every_n: 10
