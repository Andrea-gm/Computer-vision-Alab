vial_detector_node:
  ros__parameters:
    image_topic: "/camera/color/image_raw"
    # Offline stills (upright-heavy raw). Sideways eval uses scripts/evaluate.py.
    dataset_path: "E:/Desktop/Jessica/robotics/vial_dataset/raw"
    run_offline: true
    # Empty = auto-resolve package models/best.pt → Camera runs/obb-vial → AABB refine.
    model_path: "E:/Desktop/Jessica/ros2_ws/src/r2_03_obb/models/best.pt"
    camera_root: "E:/Desktop/Jessica/robotics"
    confidence_threshold: 0.25
    iou_threshold: 0.45
    imgsz: 640
    allow_classical_fallback: true
    allow_aabb_refine: true
    visualize: true
    annotated_topic: "/vial/annotated"
    detections_topic: "/vial/detections"
    detections_json_topic: "/vial/detections_json"
    frame_id: "camera_color_optical_frame"
    offline_rate_hz: 5.0
    offline_loop: false
    log_every_n: 10
