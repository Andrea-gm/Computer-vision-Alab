vial_detector_node:
  ros__parameters:
    image_topic: "/camera/color/image_raw"
    dataset_path: "E:/Desktop/Jessica/robotics/vial_dataset/raw"
    run_offline: true
    # Unused by this classical package (contract compatibility with other agents).
    model_path: ""
    confidence_threshold: 0.40
    iou_threshold: 0.35
    max_side: 640
    # Dataset is almost always one vial; keep 1 to cut clutter FPs (raise for racks).
    max_dets: 1
    grabcut_iters: 2
    use_center_prior: true
    visualize: true
    annotated_topic: "/vial/annotated"
    detections_topic: "/vial/detections"
    detections_json_topic: "/vial/detections_json"
    frame_id: "camera_color_optical_frame"
    offline_rate_hz: 5.0
    offline_loop: false
    log_every_n: 10
