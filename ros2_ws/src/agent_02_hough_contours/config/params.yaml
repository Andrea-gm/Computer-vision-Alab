vial_detector_node:
  ros__parameters:
    # Live camera topic (sensor_msgs/Image, bgr8 or rgb8).
    image_topic: "/camera/color/image_raw"
    # Offline folder of images (jpg/png). Empty = subscribe mode only.
    dataset_path: "E:/Desktop/Jessica/robotics/vial_dataset/raw"
    # true = iterate dataset_path once (or loop); false = subscribe to image_topic.
    run_offline: true
    visualize: true
    annotated_topic: "/vial/annotated"
    # Preferred: vision_msgs/Detection2DArray. Fallback: std_msgs/String JSON.
    detections_topic: "/vial/detections"
    detections_json_topic: "/vial/detections_json"
    frame_id: "camera_color_optical_frame"
    offline_rate_hz: 5.0
    offline_loop: false
    log_every_n: 10

    # --- Color prefilter (opaque white screw cap) ---
    v_min: 170
    s_max: 70

    # --- Contour / circularity / ellipse ---
    min_circularity: 0.45
    max_circularity: 1.0
    min_ellipse_ar: 0.45
    min_area_frac: 0.0015
    max_area_frac: 0.08
    cap_expand_down: 2.6
    cap_expand_side: 0.20
    min_box_aspect: 0.60
    max_box_aspect: 2.80

    # --- HoughCircles (secondary; requires white support under disk) ---
    use_hough: true
    dp: 1.2
    min_dist_frac: 0.08
    canny: 110.0
    accum: 28.0
    min_radius_frac: 0.02
    max_radius_frac: 0.12
    hough_white_support: 0.25

    # --- Selection ---
    score_thresh: 0.40
    nms_iou: 0.35
    max_dets: 2
