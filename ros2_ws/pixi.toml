# RoboStack ROS 2 Humble for native Windows (PowerShell/cmd).
# Install:  .\install_windows_ros2.ps1
# Shell:    pixi shell
# Docs:     https://robostack.github.io/GettingStarted.html

[workspace]
name = "orbbec_dual_sync_ws"
version = "0.1.0"
description = "Native Windows ROS2 Humble (RoboStack) for orbbec_dual_sync"
channels = [
  "https://prefix.dev/robostack-humble",
  "https://prefix.dev/conda-forge",
]
platforms = ["win-64"]

[dependencies]
python = "3.11.*"
ros-humble-ros-base = "*"
ros-humble-rclpy = "*"
ros-humble-sensor-msgs = "*"
ros-humble-std-msgs = "*"
ros-humble-message-filters = "*"
ros-humble-launch = "*"
ros-humble-launch-ros = "*"
ros-humble-ament-index-python = "*"
colcon-common-extensions = "*"
numpy = "*"
opencv = "*"
pip = "*"

# After first colcon build, uncomment to auto-source the overlay:
# [activation]
# scripts = ["install/setup.bat"]
